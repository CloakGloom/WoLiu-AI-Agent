# WoLiu-AI-Agent - CI 工作流
# 本项目是 Windows 桌面应用，CI 只做基础语法校验，避免重依赖编译失败
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'agent/**'
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - 'requirements.txt'
  pull_request:
    branches: [main, master]
    paths:
      - 'agent/**'
      - 'server/**'
      - 'tests/**'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (核心代码)
        run: |
          python -m compileall agent/ server/ -q
          echo "✅ Syntax OK"

      - name: Module structure check
        run: |
          test -f agent/__init__.py && echo "agent OK" || echo "agent missing"
          test -f server/__init__.py && echo "server OK" || echo "server missing"
          test -f requirements.txt && echo "requirements OK" || echo "requirements missing"
          test -f config.yaml && echo "config.yaml OK" || echo "config.yaml missing"

      - name: Verify package structure
        run: |
          python -c "
          import ast, pathlib
          for p in pathlib.Path('agent').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  print(f'SYNTAX ERROR in {p}: {e}')
                  exit(1)
          print(f'All {sum(1 for _ in pathlib.Path(\"agent\").rglob(\"*.py\"))} agent modules parse OK')
          "